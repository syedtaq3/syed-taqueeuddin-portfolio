<svg width="1600" height="1000" viewBox="0 0 1600 1000"
     xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient
                id="background"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
        >
            <stop
                    offset="0%"
                    stop-color="#111722"
            />

            <stop
                    offset="100%"
                    stop-color="#07090D"
            />
        </linearGradient>

        <linearGradient
                id="accent"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
        >
            <stop
                    offset="0%"
                    stop-color="#5EA8FF"
            />

            <stop
                    offset="100%"
                    stop-color="#2B6DFF"
            />
        </linearGradient>

    </defs>


    <!-- Background -->

    <rect
            width="1600"
            height="1000"
